{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="caixa-auth">
  <h1>👕 VesteBem</h1>
  <p class="sub">Conectando solidariedade a benefícios reais para nossa cidade.</p>
  <form method="post">
    <label>Usuário <input name="usuario" required autofocus autocomplete="username"></label>
    <label>Senha <input name="senha" type="password" required autocomplete="current-password"></label>
    <button type="submit">Entrar</button>
  </form>
  <p>Ainda não tem conta? <a href="{{ url_for('cadastro') }}">Cadastre-se</a></p>
</div>
{% endblock %}
