{% extends "base.html" %}
{% block titulo %}Admin · Categorias{% endblock %}
{% block conteudo %}
<h1>Categorias de peças</h1>
<form method="post" class="form-admin">
  <input name="nome" placeholder="Nome da categoria" required>
  <input name="pontos_por_peca" type="number" min="1" placeholder="Pontos por peça" required>
  <button type="submit">Adicionar</button>
</form>
<table>
  <tr><th>Categoria</th><th>Pontos por peça</th></tr>
  {% for c in categorias %}<tr><td>{{ c.nome }}</td><td>{{ c.pontos_por_peca }}</td></tr>{% endfor %}
</table>
{% endblock %}
