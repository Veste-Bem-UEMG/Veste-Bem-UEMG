{% extends "base.html" %}
{% block titulo %}Cadastro{% endblock %}
{% block conteudo %}
<div class="caixa-auth">
  <h1>Criar conta</h1>
  <form method="post">
    <label>Usuário <input name="usuario" value="{{ dados.usuario or '' }}" required minlength="3" maxlength="50" autocomplete="username"></label>
    <label>Senha <input name="senha" type="password" required minlength="3" autocomplete="new-password"></label>
    <label>Confirmar senha <input name="confirmar_senha" type="password" required autocomplete="new-password"></label>
    <div class="linha">
      <label class="cresce">Cidade <input name="cidade" value="{{ dados.cidade or '' }}" required></label>
      <label>Estado
        <select name="estado" required>
          <option value="">UF</option>
          {% for uf in estados %}<option {% if dados.estado == uf %}selected{% endif %}>{{ uf }}</option>{% endfor %}
        </select>
      </label>
    </div>
    <button type="submit">Cadastrar</button>
  </form>
  <p>Já tem conta? <a href="{{ url_for('login') }}">Entrar</a></p>
</div>
{% endblock %}
